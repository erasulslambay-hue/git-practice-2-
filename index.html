<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f7f1e8;
        color: #3e2723;
    }

    header {
        background: #3e2723;
        color: white;
        padding: 20px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo {
        font-size: 28px;
        font-weight: bold;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
        font-size: 16px;
    }

    nav a:hover {
        color: #d7a86e;
    }

    .hero {
        min-height: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 20px;

        background:
            linear-gradient(rgba(40,25,20,.65), rgba(40,25,20,.65)),
            url("https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=1600&q=80");

        background-size: cover;
        background-position: center;
        color: white;
    }

    .hero h1 {
        font-size: 55px;
        margin-bottom: 20px;
    }

    .hero p {
        font-size: 20px;
        margin-bottom: 30px;
    }

    .btn {
        display: inline-block;
        background: #c08b5c;
        color: white;
        padding: 14px 30px;
        border-radius: 30px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
    }

    .btn:hover {
        background: #a86f42;
    }

    section {
        padding: 70px 8%;
    }

    .title {
        text-align: center;
        font-size: 35px;
        margin-bottom: 40px;
    }

    .about {
        text-align: center;
        max-width: 800px;
        margin: auto;
        line-height: 1.8;
        font-size: 18px;
    }

    .menu {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
    }

    .card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0,0,0,.12);
        transition: .3s;
    }

    .card:hover {
        transform: translateY(-8px);
    }

    .card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
    }

    .card-content {
        padding: 20px;
    }

    .card h3 {
        font-size: 22px;
        margin-bottom: 10px;
    }

    .card p {
        color: #777;
        margin-bottom: 15px;
    }

    .price {
        font-size: 20px;
        font-weight: bold;
        color: #9a6238;
    }

    .contact {
        background: #3e2723;
        color: white;
        text-align: center;
    }

    .contact p {
        margin: 12px;
        font-size: 18px;
    }

    footer {
        background: #241512;
        color: white;
        text-align: center;
        padding: 20px;
    }

    @media (max-width: 800px) {
        header {
            flex-direction: column;
            gap: 15px;
        }

        nav a {
            margin: 0 7px;
            font-size: 14px;
        }

        .hero h1 {
            font-size: 40px;
        }

        .menu {
            grid-template-columns: 1fr;
        }
    }
</style>

</nav>
